# ═══════════════════════════════════════════════════════════════════════════
# 根级 ruff 配置 —— **只服务于 `evidence/`**（以及将来可能出现的根级脚本）
# ═══════════════════════════════════════════════════════════════════════════
# 2026-09-23 · 待裁定 ③ 的落地。
#
# ## 为什么需要它
#
# 本仓库此前**只有** `backend/pyproject.toml` 里有一份 ruff 配置，而它带着
# `extend-exclude = ["verify_*.py", ...]`。那条排除是**为 backend 自己的根级
# 诊断脚本写的**（那些脚本必须在 `import app.*` 之前设环境变量，天然触发 E402），
# 但 ruff 的排除模式**按 basename 匹配** —— 于是它同时命中了 `evidence/` 下
# **所有** `verify_*.py`。
#
# 🚨 实测（2026-09-23）：从 `backend/` 跑 `ruff check ../evidence/`
#    ⇒ **62 个 `.py` 里只扫到 20 个**，被静默排除的 **42 个恰好是整套门禁**
#    （`verify_*.py`）。也就是说，此前那句「`evidence/` 的 lint = 0 条」
#    不是「很干净」，而是「**按名字被排除掉了**」。
#    —— 与坑 46 第三形态 / 纪律 #190「**按名字守的守卫**」同族。
#
# ## 因此本配置**刻意不排除** `verify_*.py`
#
# 规则集**逐字照抄** `backend/pyproject.toml`（`select` / `ignore` /
# `line-length` / `target-version`），保证全仓**只有一套 lint 政策**：
# 谁都不许靠「换一份配置」把自己洗绿。
#
# ⚠️ 另一条纪律（本轮实测踩到）：**`--fix` 的结果也随配置变**。
#    用 `--isolated` 修好、在 `--isolated` 下复验为 0 条的文件，
#    换到正式配置下仍可能报同一条 `I001`（`evidence/authz_probe.py:72`）。
#    ⇒ **必须在「采用的那份配置」下 fix、并在同一份配置下复验**。
#
# ## ✅ 已知边界**已补上**：`W605`（2026-09-26 · 拍板 **#74**）
#
# 原状态：这套规则集**不含** `W605`（无效转义序列）。实测 `evidence/probe_switcher.py`
# 在 `compileall` 时报 `SyntaxWarning: invalid escape sequence '\s'`
# （Python 字符串里写了 JS 正则），本门禁**看不见它**。
#
# 处置：**2026-09-25** 先修**实例**（两段 CDP 表达式加 `r` 前缀 ⇒ 语义等价、警告消失；
# 见 `evidence/README.md` 坑 71）；**2026-09-26** 按拍板 **#74** 把它**纳入 `select`**
# —— 于是「实例清零」之外又多了一条**判据**（否则它只会再长回来）。
#
# 🚨 **刻意只加 `W605`，不加整个 `W`** —— 实测（2026-09-26）：
#    · `W605` 本身：`evidence/` **0 条** · `backend/` **0 条** ⇒ **零成本**
#    · 但整个 `W` 会连带引入 **`W291`（行尾空格）3 条**（evidence 1 + backend 2）
#    ⇒ 加 `W` = 立刻多 3 条**纯风格**红，逼着你去修行尾空格（价值极低）或加
#      `ignore`（等于没加）。
#    `W605` 是**真缺陷类**（无效转义会改变运行时行为），`W291` 不是 ⇒ **只取前者**。
#    ⚠️ **两份配置同步**（本文件 + `backend/pyproject.toml`），否则「全仓只有一套
#       lint 政策」这条原则就破了。
# ═══════════════════════════════════════════════════════════════════════════

line-length = 100
target-version = "py312"

# ⚠️ 这里**刻意不写 `extend-exclude`**。
#
# 一开始我写了 `extend-exclude = ["backend", "frontend"]`（想避免「从根跑
# `ruff check .`」时同一批文件被两套配置各报一次），实测后发现两点：
#   1. 这个担心**不成立** —— ruff 是**按文件就近发现配置**的：`backend/x.py`
#      会先找到 `backend/pyproject.toml`，根本轮不到本文件；
#   2. 更糟的是，它会**让根级 `ruff check .` 整棵子树跳过 `backend/`** ——
#      那正是本文件开头在骂的那件事（**静默排除**）。
# ⇒ 宁可让根级 `ruff check .` 多报一次 backend 的问题，也不留一处静默排除。

[lint]
select = ["E4", "E7", "E9", "F", "I", "W605"]
ignore = ["E501"]
