# 律小智 Prometheus 抓取配置（P0-10）
#
# 用法（本地/自托管）：
#   docker run -d --name prometheus -p 9090:9090 \
#     -v "$PWD/deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
#     prom/prometheus:latest
# 然后访问 http://localhost:9090 查询指标。
#
# 抓取目标说明：
#   - `/metrics` 不经 `/api` 前缀，便于网关层把「对外业务路由」与
#     「运维指标路由」分开管控（生产应限制为集群内可达）。
#   - 多副本部署时每个实例各暴露一份进程内指标，Prometheus 按
#     `instance` 标签自动聚合，无需额外配置。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: nlawer-api

scrape_configs:
  - job_name: nlawer-api
    metrics_path: /metrics
    static_configs:
      # 本地直接跑 uvicorn 时用 host.docker.internal；
      # docker-compose 内可直接写服务名 backend:8000
      - targets:
          - host.docker.internal:8000
        labels:
          env: local
    # 指标端点在 DB 不可用时仍应可抓取（探针语义分离），因此不设强校验

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
