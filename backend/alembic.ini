# Alembic configuration (NLawer backend)
# Real DB URL is injected by alembic/env.py from app.config.settings.DATABASE_URL_SYNC,
# so dev (SQLite) / test / prod (Postgres) share one migration set without hardcoding secrets here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# placeholder; overridden in env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
