[project]
name = "nlawer-backend"
version = "0.1.0"
description = "律小智 AI 法务助手后端（律所协作平台 + 法务助手双产品线）"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

# 排除项：
# - `verify_*.py` 是**独立诊断脚本**，必须在 `import app.*` 之前先设置
#   `DATABASE_URL` 等环境变量（否则会连到错误的库），因此天然触发 E402；
#   它们不是产品代码，不该被产品代码的 lint 规则约束。
# - 根目录一次性调试脚本（原审查已标记为「根目录脚本污染」，待清理）。
# - `_tmp_verify/*.py` / `_tmp_tests/*.py` 是**一次性性能测量与验证脚本**，
#   同样需要在 `import app.*` 之前塞 `sys.path` / 环境变量，天然触发 E402；
#   它们不随产品发布，且已被 .gitignore 忽略。
extend-exclude = [
    "verify_*.py",
    "alembic/versions/*",
    "check_chunk.py",
    "patch_migration.py",
    "_tmp_verify/*",
    "_tmp_tests/*",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W605"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 测试与诊断脚本允许在函数内 import（pytest 夹具、延迟导入重依赖）
"tests/*" = ["PLC0415"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -ra"

[tool.coverage.run]
source = ["app"]
omit = ["app/seed/*", "*/__pycache__/*", "*/tests/*"]
